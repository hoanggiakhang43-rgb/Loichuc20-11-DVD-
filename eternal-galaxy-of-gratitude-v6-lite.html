/* ===== CẤU HÌNH: chỉnh lời chúc, tên người gửi, chòm sao tại đây ===== */
const CONFIG={
 sender:'Hoàng Gia Khang',
 final:{paras:[
'Thưa thầy cô, sau tất cả những chương ký ức này, chúng em chỉ muốn nói một điều thật giản dị: cảm ơn thầy cô. Cảm ơn vì những bài học, vì từng trang vở được chỉnh lại, vì những lần thầy cô dừng bài giảng để hỏi xem chúng em đã hiểu chưa.',
'Chúng em biết ơn cả những điều không ai nhìn thấy: những đêm soạn bài muộn, những buổi chấm bài khi nhà đã lên đèn, những lúc thầy cô mệt mà vẫn đứng lớp. Công sức ấy lặng lẽ như hạt giống nằm dưới đất, nhưng là nơi mọi thứ bắt đầu.',
'Chúng em cũng xin lỗi vì những lúc chưa hiểu lòng thầy cô: những lần ồn ào, lơ đãng, những lần giận dỗi vì một lời nhắc. Lớn lên mới biết, mỗi lời ấy đều chứa đầy sự quan tâm mà ngày đó chúng em chưa đủ lớn để nhận ra.',
'Những giá trị thầy cô đã dạy, sự trung thực, lòng tử tế, tinh thần trách nhiệm, sẽ theo chúng em suốt quãng đường trưởng thành. Mỗi lần chúng em đứng dậy sau vấp ngã, mỗi lần chọn điều đúng, đều có bóng dáng thầy cô ở đó.',
'Kính chúc thầy cô luôn dồi dào sức khỏe, bình an và hạnh phúc bên gia đình. Chúc thầy cô giữ mãi nhiệt huyết trên con đường làm nghề, và luôn được vây quanh bởi những thế hệ học trò biết trân trọng, yêu thương thầy cô.',
'Nhân ngày Nhà giáo Việt Nam 20/11, chúng em xin kính gửi đến thầy cô lòng biết ơn chân thành nhất. Tri thức có thể mở ra những chân trời, nhưng chính thầy cô đã giúp chúng em đủ tự tin để bước đến đó.'],
 wish:'Kính chúc thầy cô một ngày 20/11 thật nhiều niềm vui, sức khỏe và hạnh phúc.',thanks:'Với tất cả lòng biết ơn,'}};
const CH=[
{name:'KHỞI NGUỒN ÁNH SÁNG',tint:[.95,1,1.15],intro:['Mọi thứ bắt đầu từ những điều rất nhỏ.','Một cái gật đầu khi chúng em ngập ngừng trả lời. Một dòng chữ đỏ ở lề vở. Một câu “Không sao, làm lại nhé”.','Chúng em ngồi đây, quạt trần kêu đều trên đầu, và chợt nhận ra mình đang được chăm chút từng chút một.','Xin bắt đầu từ chính những điều nhỏ ấy.'],wishes:[
'Bài toán trên bảng còn dang dở thì cục phấn gãy đôi trong tay thầy cô. Thầy cô cứ thế viết nốt bằng nửa cục phấn, như thể không điều gì được phép làm chúng em lỡ mất lời giải.',
'Thầy cô có biết câu hỏi nhỏ “Em hiểu chưa?” đã cứu chúng em bao nhiêu lần không? Nhờ câu ấy, chúng em dám giơ tay và nói thật rằng mình chưa hiểu.',
'Nét chữ đỏ ở lề vở giống một chiếc đèn pin nhỏ. Nó không bắt chúng em chạy nhanh hơn, chỉ soi cho thấy chỗ nào đường còn gập ghềnh.',
'“Em làm được mà.” Thầy cô chỉ nói khẽ như vậy khi đi ngang bàn cuối, vậy mà bài tập khó nhất hôm nay bỗng nhỏ lại. Chúng em xin cất câu ấy vào cặp.',
'Thú thật, có tiết chúng em nhớ giọng thầy cô trước khi nhớ hết bài. Nhưng chính giọng nói ấy làm cả lớp ngồi thẳng lưng, mở vở ra và thử lại lần nữa.']},
{name:'NGƯỜI GIEO HẠT',tint:[.82,1.15,.92],intro:['Có những việc thầy cô làm mà chúng em hiếm khi nhìn thấy.','Chiếc đèn bàn sáng muộn bên chồng bài kiểm tra. Cây bút đỏ chạy qua từng trang vở khi cả nhà đã ngủ.','Sáng hôm sau, thầy cô vẫn bước vào lớp như chưa từng thức khuya.','Hôm nay, xin cho chúng em để ý đến những điều lặng lẽ ấy.'],wishes:[
'Phấn trắng bám đầy tay áo, thầy cô phủi nhẹ rồi viết tiếp. Với chúng em, đó là bộ đồng phục đẹp nhất của một buổi học.',
'Nhận lại bài kiểm tra, chúng em liếc điểm trước tiên. Rồi mới thấy dòng nhận xét nắn nót bên dưới, và hiểu rằng có người đã thức để viết riêng cho từng đứa.',
'Cổ họng thầy cô khàn từ tiết thứ ba mà tiết thứ năm vẫn giảng trọn bài. Chúng em tự hỏi sức mạnh ấy lấy từ đâu ra. Chắc là từ mấy chục gương mặt đang ngước lên.',
'Thầy cô gieo hạt từ buổi sáng, tưới bằng từng bài giảng, rồi đứng đợi. Có hạt nảy mầm chậm, có hạt chưa nảy, nhưng chưa lần nào thầy cô bảo “thôi”.',
'Chúng em hứa: bài hôm nay sẽ làm xong trước khi thầy cô phải nhắc lần hai. Một lời hứa nhỏ thôi, nhưng là phần việc chúng em tự nhận để thầy cô bớt nhọc.']},
{name:'NHỮNG NGƯỜI DẪN ĐƯỜNG',tint:[1,.9,1.3],intro:['Thầy cô không chỉ dạy chúng em biết thêm một điều gì đó.','Thầy cô còn dạy cách đứng dậy sau một điểm kém, cách xin lỗi khi mình sai, cách nói thật khi nói dối dễ hơn.','Những bài học ấy không nằm trong sách giáo khoa, nhưng chúng em mang theo mỗi ngày.','Xin cùng đi tiếp trên con đường thầy cô đang chỉ.'],wishes:[
'“Điểm thấp thì sao nào?” thầy cô hỏi cả lớp rồi tự đáp: “Thì mình biết chỗ cần học.” Từ đó, tờ bài kiểm tra thấp điểm bớt đáng sợ hơn nhiều.',
'Bạn bên cạnh nghiêng vở sang, thật dễ để liếc qua. Chúng em ngồi thẳng lại, vì nhớ thầy cô từng nói: điểm không đẹp mà thật vẫn hơn điểm đẹp mà chột dạ.',
'Thầy cô giống người cầm đèn đứng ở khúc quanh. Không bế chúng em qua, chỉ giơ cao tay để chúng em tự thấy đường mà bước.',
'Lần đầu giơ tay phát biểu, tim chúng em đập nhanh hơn tiếng trống trường. Sai cũng được, thầy cô bảo vậy, nên chúng em dám nói tiếp câu thứ hai.',
'Tử tế có phải là một môn học không? Chúng em nghĩ là có: nó nằm trong cách thầy cô chào bác bảo vệ, nhặt mảnh giấy rơi, và lắng nghe đứa nói nhỏ nhất lớp.']},

{name:'DÒNG SÔNG THỜI GIAN',tint:[.8,1.1,1.3],intro:['Năm học này đang chảy như một dòng sông, và chúng em đang ở giữa dòng.','Bến đầu là ngày khai giảng, tiếng trống vang lên, áo trắng còn thơm mùi vải mới.','Rồi những tuần kiểm tra nối nhau, mùa thi kéo tới, và phía trước còn nhiều bến chưa cập.','Xin bắt đầu từ bến đầu tiên của năm học này.'],wishes:[

{name:'VƯỜN SAO CỦA LÒNG BIẾT ƠN',tint:[1.35,1.12,.8],intro:['Mỗi thầy cô là một ngôi sao riêng, không ai giống ai.','Có người nghiêm khắc, có người hay đùa. Có người chỉ cần đứng ở cửa lớp là cả lớp tự khắc ngồi thẳng.','Mỗi ngôi sao trong khu vườn này giữ một câu chuyện nhỏ của lớp học.','Xin cùng ghé qua từng ngôi sao một.'],wishes:[

{name:'NGÀN LỜI CHÚC HÓA THÀNH NGÂN HÀ',tint:[1.2,.9,1.3],intro:['Những ngôi sao nhỏ đã được thắp lên, từng ngôi một.','Giờ chúng em gom chúng thành một dải ngân hà, mỗi hạt sáng là một điều chúng em mong cho thầy cô.','Có lời nghiêm túc, có lời hơi tinh nghịch, nhưng lời nào cũng thật lòng.','Xin thầy cô nhận lấy.'],wishes:[

    m.slow+=(m.ts-m.slow)*Math.min(1,dt*4);const k=sd*m.slow;m.x+=m.vx*k;m.y+=m.vy*k;if(!m.hold)m.life-=sd;
    m.fade=m.hold?1:Math.min(1,Math.max(0,m.life)*1.5,(m.max-m.life)*3);
    if(!m.hold&&(m.life<=0||(Math.abs(m.x)>150||Math.abs(m.y)>95)&&m.max-m.life>.5)){m.on=0;continue}
    const l=Math.hypot(m.vx,m.vy)||1,ux=m.vx/l,uy=m.vy/l;
    for(let j=0;j<TL;j++){const q=m.i*TL+j;if(j>=m.len){T.al[q]=0;continue}const f=1-j/m.len;
      T.pos[q*3]=m.x-ux*j*m.sp;T.pos[q*3+1]=m.y-uy*j*m.sp;T.pos[q*3+2]=0;
      T.al[q]=m.fade*f*f*(.85+m.hot*.9);T.sz[q]=m.big*(j===0?5+m.hot*14:1.2+3.6*f)}
    if(m.comet&&Math.random()<.9)sp(m.x,m.y,R(-3,3)-ux*4,R(-3,3)-uy*4,R(1,2.2),R(1.5,3.5),C.gold,0,0,0,0,.7);
    if(m.hot>.2&&Math.random()<.7)sp(m.x,m.y,R(-6,6),R(-6,6),1.2,R(1.5,3),C.gold,0,0,0,0,.8);
  }
  upd(T);
  // hạt hiệu ứng
  for(let i=0;i<FN;i++){
    if(LF[i]<=0){F.al[i]=0;continue}
    if(DL[i]>0){DL[i]-=dt;F.al[i]=A0[i];continue}
    LF[i]-=dt;let x=F.pos[i*3],y=F.pos[i*3+1],al=A0[i],md=MD[i];
    if(md===2&&!H.on){md=MD[i]=0}
    if(md===1){const age=LM[i]-LF[i];
      if(age<.5){const f=1-1.8*dt;FX[i]*=f;FY[i]*=f}
      else{const dx=TX[i]-x,dy=TY[i]-y,d=Math.hypot(dx,dy)+.001;if(d<1.8){LF[i]=0;F.al[i]=0;continue}
        FX[i]+=dx/d*150*dt;FY[i]+=dy/d*150*dt;const f=1-2.4*dt;FX[i]*=f;FY[i]*=f;al*=Math.min(1,d/9)}}
    else if(md===2){const dx=H.x-x,dy=H.y-y,d=Math.hypot(dx,dy)+.001;if(d<2.5){LF[i]=0;F.al[i]=0;continue}
      FX[i]+=dx/d*170*dt;FY[i]+=dy/d*170*dt;const f=1-1.5*dt;FX[i]*=f;FY[i]*=f}
    else{const f=1-.9*dt;FX[i]*=f;FY[i]*=f;al*=Math.min(1,LF[i]/LM[i]*2)}
    F.pos[i*3]=x+FX[i]*dt;F.pos[i*3+1]=y+FY[i]*dt;F.al[i]=al;
  }
  upd(F);
  if(EN.st.on)EN.tick(dt,time);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
